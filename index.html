<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F96000">
<meta property="og:title" content="Ebru Tray">
<meta property="og:description" content="Marble paper with UNFPA colours. Not a Single Degree More, COP31 Antalya.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23131619'/%3E%3Ccircle cx='16' cy='16' r='10' fill='%23EFF1F7'/%3E%3Ccircle cx='16' cy='16' r='7' fill='%23F96000'/%3E%3C/svg%3E">
<title>Ebru Tray</title>
<meta name="description" content="Marble paper in the browser with UNFPA colours: drop, stylus and comb, then save an image or video. Not a Single Degree More, COP31 Antalya.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: full-viewport app. Tool rail on the left, the tray fills the rest. On phones the rail drops under the tray and scrolls sideways. */
:root{
  --bg:#E3E5EB; --panel:#FFFFFF; --fg:#131619; --muted:#686A6C; --line:#D9DBE1; --hover:#EFF1F7;
  --accent:#F96000; --accent-fg:#FFFFFF; --sel:#131619; --tray-shadow:rgba(19,22,25,.18);
  --display:"Atkinson Hyperlegible", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", system-ui, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B0D10; --panel:#16191D; --fg:#EFF1F7; --muted:#9EA1A6; --line:#2A2E33; --hover:#20242A;
  --accent:#FB904D; --accent-fg:#131619; --sel:#EFF1F7; --tray-shadow:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B0D10; --panel:#16191D; --fg:#EFF1F7; --muted:#9EA1A6; --line:#2A2E33; --hover:#20242A;
  --accent:#FB904D; --accent-fg:#131619; --sel:#EFF1F7; --tray-shadow:rgba(0,0,0,.6); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:13px;line-height:1.4;overflow:hidden;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:16px}
.app{height:100%;display:grid;grid-template-columns:252px minmax(0,1fr);gap:16px}
.rail{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 14px;display:flex;flex-direction:column;gap:15px;overflow-y:auto;min-width:0}
.brand h1{font-family:var(--display);font-weight:700;font-size:25px;line-height:1.02;margin:0;letter-spacing:-.015em}
.brand p{margin:4px 0 0;font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.sec{display:flex;flex-direction:column;gap:8px}
.lab{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.lab b{font-weight:500;color:var(--fg);letter-spacing:.04em;text-transform:none;font-family:var(--body);font-size:12px}
button,select{font:inherit;color:var(--fg)}
.tools{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.tool{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 4px 7px;border-radius:10px;border:1px solid var(--line);background:transparent;cursor:pointer;font-weight:700;font-size:12px}
.tool:hover{background:var(--hover)}
.tool[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.tool svg{width:24px;height:24px}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.act{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:9px;border:1px solid var(--line);background:transparent;cursor:pointer;font-weight:700;font-size:12px;text-align:left}
.act:hover{background:var(--hover)}
.act svg{width:18px;height:18px;flex:none}
.act:disabled{opacity:.4;cursor:default}
.act.primary{background:var(--fg);color:var(--panel);border-color:var(--fg)}
.act.rec{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.sw{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:0 6px}
.sw button{aspect-ratio:1;border-radius:50%;border:none;cursor:pointer;box-shadow:inset 0 0 0 1px rgba(19,22,25,.16);position:relative}
.sw button[aria-pressed="true"]{box-shadow:0 0 0 2px var(--panel),0 0 0 4px var(--sel)}
.accrow{display:flex;gap:6px}
.accrow button{flex:1;padding:5px 0;border-radius:20px;border:1px solid var(--line);background:transparent;cursor:pointer;font-size:11.5px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:5px}
.accrow button i{width:9px;height:9px;border-radius:50%}
.accrow button[aria-pressed="true"]{border-color:var(--sel)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:6px 10px;border-radius:20px;border:1px solid var(--line);background:transparent;cursor:pointer;font-weight:700;font-size:12px;display:flex;align-items:center;gap:6px}
.chip i{width:12px;height:12px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(19,22,25,.25)}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--panel);border-color:var(--fg)}
input[type=range]{width:100%;accent-color:var(--accent)}
.status{font-size:12px;color:var(--muted);min-height:1.4em}
.kits{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.kit{display:grid;grid-template-columns:10px 1fr;column-gap:7px;align-items:center;text-align:left;padding:8px 9px;border-radius:9px;border:1px solid var(--line);background:transparent;cursor:pointer}
.kit:hover{background:var(--hover)}
.kit i{width:10px;height:10px;border-radius:50%;grid-row:span 2}
.kit b{font-size:12.5px}
.kit small{font-size:10.5px;color:var(--muted);grid-column:2}
.kit[aria-pressed="true"]{border-color:var(--fg);box-shadow:inset 0 0 0 1px var(--fg)}
.chk{display:flex;gap:7px;align-items:center;font-size:12px;cursor:pointer}
.status.on{color:var(--accent);font-weight:700}
.foot{margin-top:auto;font-size:11px;color:var(--muted)}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.stage{position:relative;min-width:0;min-height:0;display:flex;align-items:center;justify-content:center}
#ov{position:absolute;pointer-events:none;box-shadow:none;border-radius:0}
canvas{display:block;border-radius:6px;box-shadow:0 1px 2px var(--tray-shadow),0 24px 60px var(--tray-shadow);touch-action:none;cursor:crosshair}
.tip{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);background:rgba(19,22,25,.82);color:#EFF1F7;font-size:12px;padding:7px 14px;border-radius:20px;pointer-events:none;transition:opacity .4s;white-space:nowrap}
@media (max-width:760px){
  body{padding-block:10px}
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto;gap:10px}
  .stage{order:1}
  .rail{order:2;flex-direction:row;align-items:flex-start;overflow-x:auto;overflow-y:hidden;padding:10px;gap:16px;max-height:124px}
  .chips{flex-wrap:nowrap}.sw{padding:0}
  .rail .sec{flex:none;width:auto}
  .brand,.foot,.hide-m{display:none}
  .tools{grid-template-columns:repeat(3,58px)}
  .sw{grid-template-columns:repeat(8,26px);gap:6px}
  .sw.acc{grid-template-columns:repeat(4,26px)}
  .acts{grid-template-columns:repeat(2,auto)}
  .sec.size{width:130px}
}
@media (prefers-reduced-motion: reduce){.tip{transition:none}}
</style>
<style>body{margin:0}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{height:100%}</style>
</head>
<body>


<div class="app">
  <aside class="rail" aria-label="Tools and palette">
    <div class="brand">
      <h1>Ebru<br>Tray</h1>
      <p>UNFPA · COP31 Antalya</p>
    </div>

    <div class="sec">
      <div class="lab"><span>Campaign kits</span><span class="hide-m">Not a Single Degree More</span></div>
      <div class="kits" role="group" aria-label="Campaign kits">
        <button class="kit" data-kit="health"><i style="background:#F10F45"></i><b>Health</b><small>1°C · +6% stillbirth</small></button>
        <button class="kit" data-kit="gender"><i style="background:#9C1ED6"></i><b>Gender</b><small>14× higher risk</small></button>
        <button class="kit" data-kit="youth"><i style="background:#2171EC"></i><b>Youth</b><small>7× more heatwaves</small></button>
        <button class="kit" data-kit="resilience"><i style="background:#F96000"></i><b>Resilience</b><small>4 in 5 displaced</small></button>
      </div>
      <label class="chk"><input type="checkbox" id="kittext" checked> Show campaign text</label>
    </div>

    <div class="sec">
      <div class="lab">Tool</div>
      <div class="tools" role="group" aria-label="Tool">
        <button class="tool" data-tool="drop" aria-pressed="true" title="Drop: tap, hold to grow">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M12 3.5c3.4 4.4 6 7.6 6 10.8a6 6 0 0 1-12 0c0-3.2 2.6-6.4 6-10.8z"/><path d="M9.2 15.2a3 3 0 0 0 2.6 2.4" stroke-linecap="round"/></svg>Drop</button>
        <button class="tool" data-tool="needle" aria-pressed="false" title="Stylus: drag to pull the paint">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M4 20l9.5-9.5"/><rect x="13.2" y="3.6" width="4.2" height="9" rx="1.6" transform="rotate(45 15.3 8.1)"/><path d="M3 21l1-1"/></svg>Stylus</button>
        <button class="tool" data-tool="comb" aria-pressed="false" title="Comb: drag to rake a band of paint">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M3.5 6.5h17"/><path d="M5.5 6.5V18M9.2 6.5V18M12.9 6.5V18M16.6 6.5V18M20.3 6.5V18"/></svg>Comb</button>
      </div>
    </div>

    <div class="sec size">
      <div class="lab"><span>Size</span><b id="sizev">Medium</b></div>
      <input type="range" id="size" min="0" max="100" value="40" aria-label="Size">
    </div>

    <div class="sec">
      <div class="lab"><span>Paint</span><b id="cname">UNFPA Orange</b></div>
      <div class="sw" id="sw" role="group" aria-label="Primary colours"></div>
    </div>

    <div class="sec">
      <div class="lab"><span>Accent</span><span class="hide-m">one per design</span></div>
      <div class="accrow" role="group" aria-label="Accent colour">
        <button data-acc="blue" aria-pressed="true"><i style="background:#2171EC"></i>Blue</button>
        <button data-acc="red" aria-pressed="false"><i style="background:#F10F45"></i>Red</button>
        <button data-acc="purple" aria-pressed="false"><i style="background:#9C1ED6"></i>Purple</button>
      </div>
      <div class="sw acc" id="sw2" role="group" aria-label="Accent tints"></div>
    </div>

    <div class="sec">
      <div class="lab">Ground</div>
      <div class="chips" role="group" aria-label="Ground">
        <button class="chip" data-g="#EFF1F7" aria-pressed="true"><i style="background:#EFF1F7"></i>Off-white</button>
        <button class="chip" data-g="#F6EDE4" aria-pressed="false"><i style="background:#F6EDE4"></i>Warm</button>
        <button class="chip" data-g="#131619" aria-pressed="false"><i style="background:#131619"></i>Black</button>
      </div>
    </div>

    <div class="sec">
      <div class="lab">Actions</div>
      <div class="acts">
        <button class="act" id="battal"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="6" cy="7" r="1.8"/><circle cx="13" cy="5" r="1.2"/><circle cx="18" cy="9" r="2.2"/><circle cx="9" cy="13" r="2.4"/><circle cx="16" cy="16" r="1.4"/><circle cx="6" cy="19" r="1.3"/><circle cx="12" cy="20" r="1"/></svg>Sprinkle</button>
        <button class="act" id="family"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="6" cy="6" r="2.2"/><path d="M3 20c0-6 1.2-9.5 3-9.5S9 14 9 20z"/><circle cx="14" cy="7.5" r="2"/><path d="M11 20c.6-5 1.4-8 3-8s2.4 3 3 8z"/><circle cx="20" cy="12" r="1.5"/><path d="M18.3 20c.3-3 .8-5 1.7-5s1.4 2 1.7 5z"/></svg>Family</button>
        <button class="act" id="undo" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 7L4 12l5 5"/><path d="M4 12h10a6 6 0 0 1 0 12h-2" transform="translate(0 -4)"/></svg>Undo</button>
        <button class="act" id="clear"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4.5h6V7M6.5 7l1 13h9l1-13"/></svg><span>Clear</span></button>
      </div>
    </div>

    <div class="sec">
      <div class="lab">Tray and export</div>
      <div class="chips" role="group" aria-label="Tray ratio">
        <button class="chip" data-f="full" aria-pressed="true">Full</button>
        <button class="chip" data-f="4:5" aria-pressed="false">4:5</button>
        <button class="chip" data-f="1:1" aria-pressed="false">1:1</button>
        <button class="chip" data-f="9:16" aria-pressed="false">9:16</button>
      </div>
      <div class="acts">
        <button class="act primary" id="png"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="14" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="M4 17l5-4 4 3 3-2 4 3"/></svg>Image</button>
        <button class="act rec" id="rec"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="6"/></svg><span>Video</span></button>
      </div>
      <button class="act" id="vdl" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>Download video</button>
      <div class="status" id="status" aria-live="polite"></div>
    </div>

    <p class="foot">Once it’s on paper, it can’t be undone. On the water, you still can.</p>
  </aside>

  <main class="stage" id="stage">
    <canvas id="cv" aria-label="Ebru tray. Tap to drop paint, drag to draw patterns."></canvas>
    <canvas id="ov" aria-hidden="true"></canvas>
    <div class="tip" id="tip">Tap: drop · Hold: grow</div>
  </main>
</div>

<script>
(()=>{
// ---------- palette (UNFPA brand) ----------
const PRIMARY=[
  ["UNFPA Orange","#F96000"],["Dark Orange","#AE4300"],["Pastel Orange","#FB904D"],["Light Orange","#FDCFB3"],
  ["UNFPA Black","#131619"],["Grey","#686A6C"],["Light Grey","#D9DBE1"],["Off White","#EFF1F7"]
];
const ACCENTS={
  blue:[["UNFPA Blue","#2171EC"],["Dark Blue","#184EA5"],["Pastel Blue","#649BF2"],["Light Blue","#BDD4F9"]],
  red:[["UNFPA Red","#F10F45"],["Dark Red","#A00F31"],["Pastel Red","#ED5B7E"],["Light Red","#F7B9C8"]],
  purple:[["UNFPA Purple","#9C1ED6"],["Dark Purple","#6D1496"],["Pastel Purple","#BA61E2"],["Light Purple","#E1BBF3"]]
};
const $=id=>document.getElementById(id);
const cv=$("cv"),ctx=cv.getContext("2d"),stage=$("stage");
let W=1200,H=1500,U=1200,fmt="full";
let shapes=[],ground="#EFF1F7",tool="drop",color=PRIMARY[0][1],size=0.4,accentKey="blue";
let history=[],active=null,stroke=null,dirty=true,ops=[],op=null;
const MAXSEG=0.0028,MAXPTS=9000;

// ---------- colour helpers ----------
const hex2rgb=h=>{const n=parseInt(h.slice(1),16);return[n>>16,n>>8&255,n&255]};
const rgb=(r,g,b,a)=>a==null?`rgb(${r|0},${g|0},${b|0})`:`rgba(${r|0},${g|0},${b|0},${a})`;
// each drop of pigment lands slightly differently: a small, stable shift in value
function jitter(hex){const[r,g,b]=hex2rgb(hex),k=1+(Math.random()-.5)*0.07;return rgb(Math.min(255,r*k),Math.min(255,g*k),Math.min(255,b*k))}
function edge(hex,a){const[r,g,b]=hex2rgb(hex),lum=(r+g+b)/3,f=lum>200?0.86:0.62,k=lum>200?0.45:1;return rgb(r*f,g*f,b*f,a*k)}
const mkShape=(pts,c)=>({pts,color:c,fill:jitter(c)});

// ---------- marbling geometry ----------
function circle(cx,cy,r,n){const p=[];for(let i=0;i<n;i++){const a=i/n*Math.PI*2;p.push(cx+Math.cos(a)*r,cy+Math.sin(a)*r)}return p}
const circleN=r=>Math.max(48,Math.min(1800,Math.round(2*Math.PI*r/MAXSEG)));
function displaceDrop(p,cx,cy,dR2){for(let i=0;i<p.length;i+=2){const dx=p[i]-cx,dy=p[i+1]-cy,d2=dx*dx+dy*dy;if(d2<1e-12)continue;const s=Math.sqrt(1+dR2/d2);p[i]=cx+dx*s;p[i+1]=cy+dy*s}}
function displaceNeedle(p,ax,ay,bx,by,sig){
  const vx=bx-ax,vy=by-ay,L2=vx*vx+vy*vy||1e-12,cut=sig*12;
  const x0=Math.min(ax,bx)-cut,x1=Math.max(ax,bx)+cut,y0=Math.min(ay,by)-cut,y1=Math.max(ay,by)+cut;
  for(let i=0;i<p.length;i+=2){const x=p[i],y=p[i+1];if(x<x0||x>x1||y<y0||y>y1)continue;
    let t=((x-ax)*vx+(y-ay)*vy)/L2;t=t<0?0:t>1?1:t;const d=Math.hypot(x-(ax+vx*t),y-(ay+vy*t));
    const f=(sig/(d+sig))*Math.exp(-d/(5*sig));p[i]=x+vx*f;p[i+1]=y+vy*f}
}
// rake: a bar of tines held across the direction of travel; only paint near the tines moves
function displaceRake(p,ax,ay,bx,by,nx,ny,half,sp,sig,reach){
  const vx=bx-ax,vy=by-ay,L=Math.hypot(vx,vy)||1e-12,mx=vx/L,my=vy/L,lim=half+sp,far=reach*3;
  for(let i=0;i<p.length;i+=2){const rx=p[i]-ax,ry=p[i+1]-ay,n=rx*nx+ry*ny;if(n>lim||n<-lim)continue;
    const a=rx*mx+ry*my,da=a<0?-a:a>L?a-L:0;if(da>far)continue;
    const m=Math.abs(n-sp*Math.round(n/sp)),e=Math.min(1,Math.max(0,(half-Math.abs(n))/sp+0.5));
    const f=(sig/(m+sig))*Math.exp(-(da*da)/(reach*reach))*e*e*(3-2*e);
    p[i]+=vx*f;p[i+1]+=vy*f}
}
function displaceComb(p,sx,sy,vx,vy,sp,sig){
  const L=Math.hypot(vx,vy)||1e-12,nx=-vy/L,ny=vx/L;
  for(let i=0;i<p.length;i+=2){const n=(p[i]-sx)*nx+(p[i+1]-sy)*ny;let m=((n%sp)+sp)%sp;m=Math.min(m,sp-m);const f=sig/(m+sig);p[i]+=vx*f;p[i+1]+=vy*f}
}
function refine(s){
  const p=s.pts,n=p.length/2;if(n>=MAXPTS)return;
  let need=false;for(let i=0;i<n;i++){const j=(i+1)%n,dx=p[2*j]-p[2*i],dy=p[2*j+1]-p[2*i+1];if(dx*dx+dy*dy>MAXSEG*MAXSEG){need=true;break}}
  if(!need)return;
  const out=[];
  for(let i=0;i<n;i++){const j=(i+1)%n,h=(i-1+n)%n,k=(j+1)%n,x0=p[2*i],y0=p[2*i+1];out.push(x0,y0);
    const L=Math.hypot(p[2*j]-x0,p[2*j+1]-y0);
    if(L>MAXSEG&&out.length/2<MAXPTS){const q=Math.min(8,Math.ceil(L/MAXSEG));
      for(let m=1;m<q;m++){const t=m/q,t2=t*t,t3=t2*t;for(let d=0;d<2;d++){const P0=p[2*h+d],P1=p[2*i+d],P2=p[2*j+d],P3=p[2*k+d];
        out.push(0.5*((2*P1)+(-P0+P2)*t+(2*P0-5*P1+4*P2-P3)*t2+(-P0+3*P1-3*P2+P3)*t3))}}}}
  s.pts=out;
}
const refineAll=()=>{for(const s of shapes)refine(s)};
function cull(){const mx=W/U/2+0.4,my=H/U/2+0.4;shapes=shapes.filter(s=>{const p=s.pts;for(let i=0;i<p.length;i+=2)if(Math.abs(p[i])<mx&&Math.abs(p[i+1])<my)return true;return false})}
// ---------- liquid imperfection: no drop lands as a perfect circle, and the bath keeps moving a little ----------
function wobble(amp){return{a:amp,h:[[2,Math.random()*6.283,1],[3,Math.random()*6.283,.55],[5,Math.random()*6.283,.3]]}}
function kAt(w,th){let s=0;for(const[f,ph,am]of w.h)s+=am*Math.sin(f*th+ph);return 1+w.a*s/1.85}

  ctx.font=`400 ${sm}px "Atkinson Hyperlegible", system-ui, sans-serif`;const L3=wrapText(ctx,K.stat,maxW*0.92);
  const hTot=L1.length*big*1.05+mid*0.5+L2.length*mid*1.22+sm*0.9+L3.length*sm*1.35+sm*1.4+tag;
  let y=H-m-hTot+big;
  ctx.fillStyle="#131619";ctx.font=`700 ${big}px "Atkinson Hyperlegible", system-ui, sans-serif`;for(const l of L1){ctx.fillText(l,m,y);y+=big*1.05}
  y+=mid*0.5;ctx.font=`700 ${mid}px "Atkinson Hyperlegible", system-ui, sans-serif`;ctx.fillStyle="#F96000";for(const l of L2){ctx.fillText(l,m,y);y+=mid*1.22}
  y+=sm*0.9-mid*0.22;ctx.font=`400 ${sm}px "Atkinson Hyperlegible", system-ui, sans-serif`;ctx.fillStyle="#131619";for(const l of L3){ctx.fillText(l,m,y);y+=sm*1.35}
  y+=sm*0.8;ctx.font=`500 ${tag}px "IBM Plex Mono", monospace`;ctx.fillStyle="#686A6C";ctx.fillText("#COP31   Source: UNFPA",m,y);
  ctx.restore();
}

// ---------- loop ----------
function step(dt){
  stepOps(dt);
  if(active){let r=active.r;const g=active.grow||.22,w=active.w||wobble(0);
    if(r<active.R)r=Math.min(active.R,r+active.R*dt/g);
    else if(active.held)r+=0.05*dt;
    else if(active.tt<(active.tail||0)){active.tt+=dt;const q=active.tt/active.tail;r+=active.R*0.07*dt/active.tail*(1-q)*2}  // ink keeps creeping outward a moment
    else{const calm=active.calm;finishActive();stir(calm?0.08:0.5);r=null}
    if(r!=null&&active){
      const d=r*r-active.r*active.r;if(d>0)for(const s of shapes)displaceDropW(s.pts,active.x,active.y,d,w);
      // the drop slides on the bath and drags the paint around it
      if(active.vx){const nx=active.x+active.vx*dt,ny=active.y+active.vy*dt,sig=Math.max(0.004,r*0.6);
        for(const s of shapes)displaceNeedle(s.pts,active.x,active.y,nx,ny,sig);active.x=nx;active.y=ny;active.vx*=0.97;active.vy*=0.97}
      refineAll();active.r=r;dirty=true}}
  stepFlow(dt);
  if(kit&&!op&&!ops.length&&!active&&kitAlpha<1){kitAlpha=Math.min(1,kitAlpha+dt/0.9);dirty=true}
}
let last=null;
function frame(ts){const dt=last==null?0:Math.min(.05,(ts-last)/1000);last=ts;step(dt);if(dirty){render();dirty=false}requestAnimationFrame(frame)}
window.__run=sec=>{for(let i=0;i<sec*60;i++)step(1/60);render()};

// ---------- battal + opening pattern ----------
function seedRand(s){return()=>{s=(s*16807)%2147483647;return(s-1)/2147483646}}
function battal(c,count,rand){rand=rand||Math.random;const ex=W/U/2+0.02,ey=H/U/2+0.02;
  for(let i=0;i<count;i++){const r=0.004+rand()*rand()*0.022;addDropInstant((rand()*2-1)*ex,(rand()*2-1)*ey,r,c)}
  refineAll();dirty=true}
function seed(){
  shapes=[];const r=seedRand(11);
  battal("#D9DBE1",Math.round(150*Math.max(W,H)/U),r);battal("#FDCFB3",Math.round(50*Math.max(W,H)/U),r);
  [["#131619",0.13],["#EFF1F7",0.10],["#F96000",0.075],["#AE4300",0.05],["#FDCFB3",0.028]].forEach(([c,R])=>addDropInstant(0,-0.02,R,c));
  addDropInstant(-0.28,0.3,0.06,"#F96000");addDropInstant(-0.28,0.3,0.035,"#EFF1F7");
  addDropInstant(0.27,-0.33,0.05,"#686A6C");addDropInstant(0.27,-0.33,0.025,"#FB904D");
  refineAll();dirty=true;
}

// ---------- UI ----------
function markSel(){document.querySelectorAll(".sw button").forEach(x=>x.setAttribute("aria-pressed",x.dataset.c===color?"true":"false"))}
function swatches(el,list){el.innerHTML="";list.forEach(([n,c])=>{const b=document.createElement("button");b.style.background=c;b.title=n;b.setAttribute("aria-label",n);b.dataset.c=c;
  b.onclick=()=>{color=c;$("cname").textContent=n;markSel()};el.appendChild(b)});markSel()}
swatches($("sw"),PRIMARY);swatches($("sw2"),ACCENTS[accentKey]);
document.querySelectorAll("[data-acc]").forEach(b=>b.onclick=()=>{
  const wasAcc=Object.values(ACCENTS).flat().some(x=>x[1]===color);accentKey=b.dataset.acc;
  document.querySelectorAll("[data-acc]").forEach(x=>x.setAttribute("aria-pressed",x===b?"true":"false"));
  if(wasAcc){color=ACCENTS[accentKey][0][1];$("cname").textContent=ACCENTS[accentKey][0][0]}
  swatches($("sw2"),ACCENTS[accentKey])});
const TIPS={drop:"Tap: drop · Hold: grow",needle:"Drag: pull the paint with the stylus",comb:"Drag: rake a band of paint"};
document.querySelectorAll(".tool").forEach(b=>b.onclick=()=>{tool=b.dataset.tool;clearRake();document.querySelectorAll(".tool").forEach(x=>x.setAttribute("aria-pressed",x===b?"true":"false"));showTip(TIPS[tool])});
$("size").oninput=e=>{size=e.target.value/100;clearRake();$("sizev").textContent=size<0.25?"Small":size<0.6?"Medium":"Large"};
function setGround(g,push){if(push)snap();ground=g;document.querySelectorAll("[data-g]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.g===g?"true":"false"));dirty=true}
document.querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>setGround(b.dataset.g,true));
document.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{fmt=b.dataset.f;document.querySelectorAll("[data-f]").forEach(x=>x.setAttribute("aria-pressed",x===b?"true":"false"));layout()});
document.querySelectorAll("[data-kit]").forEach(b=>b.onclick=()=>runKit(b.dataset.kit));
$("kittext").onchange=e=>{kitText=e.target.checked;dirty=true};
$("battal").onclick=()=>{snap();finishActive();battal(color,Math.round(70*Math.max(W,H)/U));cull()};
$("family").onclick=()=>{if(op||ops.length)return;snap();finishActive();ops=familyOps();showTip("The family is forming, drop by drop")};
let clearArm=0;const clearLbl=$("clear").querySelector("span");
$("clear").onclick=()=>{
  if(Date.now()-clearArm>2500){clearArm=Date.now();clearLbl.textContent="Sure?";setTimeout(()=>{clearLbl.textContent="Clear"},2500);return}
  snap();shapes=[];active=null;ops=[];op=null;dirty=true;kit=null;markKit();clearLbl.textContent="Clear";clearArm=0;status("Tray cleared. Undo brings it back.")};
const tipEl=$("tip");let tipT;
function showTip(t){tipEl.textContent=t;tipEl.style.opacity=1;clearTimeout(tipT);tipT=setTimeout(hideTip,2600)}
function hideTip(){tipEl.style.opacity=0}
function status(t,on){$("status").textContent=t;$("status").classList.toggle("on",!!on)}

// ---------- saving ----------
let dlCap;
async function getDL(){if(dlCap!==undefined)return dlCap;dlCap=window.claude&&window.claude.use?await window.claude.use("downloads").catch(()=>null):null;return dlCap}
async function saveBlob(blob,name){
  const dl=await getDL();
  if(dl){try{await dl.save({filename:name,data:blob});status("Saved.")}catch(e){status(e&&e.code==="declined"?"Save cancelled.":"Couldn’t save the file.")}return}
  const u=URL.createObjectURL(blob),a=document.createElement("a");a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);status("Downloaded.")}
const stamp=()=>new Date().toISOString().slice(0,16).replace(/[-:T]/g,"");
$("png").onclick=()=>{render();cv.toBlob(b=>b&&saveBlob(b,`ebru-${stamp()}.png`),"image/png")};
let rec=null,chunks=[],vblob=null,vext="webm";const recLbl=$("rec").querySelector("span");
$("rec").onclick=()=>{
  if(rec){rec.stop();return}
  if(!window.MediaRecorder||!cv.captureStream){status("This browser can’t record video.");return}
  const t=["video/mp4;codecs=avc1","video/mp4","video/webm;codecs=vp9","video/webm"].find(x=>MediaRecorder.isTypeSupported(x))||"";vext=t.includes("mp4")?"mp4":"webm";
  try{rec=new MediaRecorder(cv.captureStream(60),{mimeType:t||undefined,videoBitsPerSecond:14e6})}catch(err){status("Couldn’t start recording.");rec=null;return}
  chunks=[];rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};
  rec.onstop=()=>{vblob=new Blob(chunks,{type:rec.mimeType||"video/webm"});rec=null;recLbl.textContent="Video";$("vdl").hidden=false;status(`Video ready (${vext.toUpperCase()}, ${(vblob.size/1e6).toFixed(1)} MB).`)};
  rec.start(250);dirty=true;recLbl.textContent="Stop";$("vdl").hidden=true;status("Recording… keep working on the tray.",true)};
$("vdl").onclick=()=>{if(vblob)saveBlob(vblob,`ebru-${stamp()}.${vext}`)};

// ---------- boot ----------
layout();seed();requestAnimationFrame(frame);setTimeout(hideTip,4500);
})();
</script>
